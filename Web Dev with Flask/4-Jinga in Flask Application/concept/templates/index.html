<!DOCTYPE html>
<!-- This page demonstrates basic Jinja expressions and Flask URL generation. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
<body>
    <h1>Hello World!!</h1>
    <!-- Jinja can evaluate simple expressions while rendering the page. -->
    <h2>{{5 * 6}}</h2>
    <h3>Random Number {{ num }}</h3>
<!-- url_for() creates a URL from the Flask endpoint name and its argument. -->
<a href="{{ url_for('get_blog', num=3) }}">Go to Blog</a>
</body>
<footer>
    <p>Copyright {{ year }}. Build by Robert Browne at DataStars</p>
</footer>
</html>
