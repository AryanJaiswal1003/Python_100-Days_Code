<!DOCTYPE html>
<!-- Values rendered on this page come from render_template() in the guess route. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess</title>
</head>
<body>
    <!-- .title() is a Python string method available to this Jinja value. -->
    <h1>Hey {{ person_name.title() }}</h1>
    <h2>I think you are {{ gender }}</h2>
    <h3>And maybe of {{ age }} years old</h3>
</body>
</html>
