<!DOCTYPE html>
<!-- This template displays one Post object selected by its numeric ID. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
<div class="wrapper">
    <div class="top">
        <div class="title"><h1>My Blog</h1></div>
    </div>
    <div class="content">
        <div class="card">
            <!-- Dot notation reads the attributes created by the Post class. -->
            <h1> {{ post.title }} </h1>
            <h2> {{ post.subtitle }} </h2>
            <p> {{ post.body }} </p>
        </div>

    </div>
</div>
</body>
<footer>
    <p>Thank You!!</p>
</footer>
</html>
