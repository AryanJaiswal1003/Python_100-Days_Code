<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Newsletter</title>
<style>body{font-family:"DejaVu Sans",Arial,sans-serif;margin:8px;font-size:14px} button{padding:4px 10px}</style></head>
<body>
  <h4 id="news-title" style="margin:0 0 6px">Weekly data jobs newsletter</h4>
  <input type="email" id="email" placeholder="you@example.com">
  <button id="subscribe" type="button"
          onclick="document.getElementById('news-msg').textContent='Subscribed: '+document.getElementById('email').value">Subscribe</button>
  <p id="news-msg"></p>
</body>
</html>
